name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-screens:
    # The installer's and node doctor's menus, driven in tmux as a person
    # would: a menu that stops appearing fails here, before a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Drive the installer's menus
        run: |
          sudo apt-get install -y -qq tmux whiptail >/dev/null
          bash scripts/capture_tui.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: installer-screens
          path: release-assets/*.ans
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Backend tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          for file in web/js/*.js web/sw.js; do node --check "$file"; done
      - name: Frontend unit tests
        run: node --test tests/*.test.js
      - name: Compile Python
        run: python -m compileall -q server
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: homestead:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
