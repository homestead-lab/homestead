name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # What a pull request touches decides which of the slow checks it needs:
    # the page and dialog audits for the web app, the installer's screens
    # for the installer. A diff that only moves version numbers (a release
    # bump) touches neither. A push to main runs everything.
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.paths.outputs.ui }}
      installer: ${{ steps.paths.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: paths
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; echo "installer=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The checkout is the pull request merged into main: its first
          # parent is main, so this diff is exactly what the merge brings.
          touches() {
            git diff -U0 HEAD^1 HEAD -- "$@" | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---) ' \
              | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+/X/g' > /tmp/lines || true
            [ "$(grep '^+' /tmp/lines | cut -c2- | sort)" != "$(grep '^-' /tmp/lines | cut -c2- | sort)" ] && echo true || echo false
          }
          ui=$(touches web scripts/audit_dialogs.mjs scripts/audit_pages.mjs .github/workflows/ci.yml)
          installer=$(touches scripts/install.sh scripts/capture_tui.sh scripts/render_tui.mjs .github/workflows/ci.yml)
          echo "ui=$ui installer=$installer"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"; echo "installer=$installer" >> "$GITHUB_OUTPUT"
  source-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rehearse SSH trust and interrupted copies in an isolated fixture
        run: |
          docker build -f tests/integration/source-copy.Dockerfile -t homestead-source-copy-fixture:ci .
          docker run --rm --network none --mount "type=bind,source=$PWD,target=/repo,readonly" homestead-source-copy-fixture:ci
  installer-screens:
    # The installer's and node doctor's menus, driven in tmux as a person
    # would: a menu that stops appearing fails here, before a release.
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Drive the installer's menus
        run: |
          sudo apt-get install -y -qq tmux whiptail >/dev/null
          bash scripts/capture_tui.sh
      - name: Draw them as the wiki shows them
        if: always()
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node scripts/render_tui.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installer-screens
          path: |
            release-assets/*.ans
            release-assets/*.png
  dialogs:
    # Every dialog and every page opened against the demo data at a desktop
    # and a phone width, and checked against docs/design.md: content wider
    # than the screen or dialog, text under 10px, or one that no longer
    # opens fails here.
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Check every dialog
        run: |
          PORT=4173 WEBROOT=web DATA_DIR=/tmp/homestead-demo-data python server/server.py >/tmp/homestead-demo.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/audit_dialogs.mjs
      - name: Check every page
        if: always()
        run: node scripts/audit_pages.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dialogs-and-pages
          path: |
            release-assets/dialogs
            release-assets/pages
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install allocation client test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-topology.txt
      - name: Backend tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          for file in web/js/*.js web/sw.js; do node --check "$file"; done
      - name: Frontend unit tests
        run: node --test tests/*.test.js
      - name: Compile Python
        run: python -m compileall -q server
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: homestead:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify self-data copies in the built Linux image
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /data \
            --user 0:0 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add FSETID \
            --security-opt no-new-privileges \
            --env HOMESTEAD_TEST_SERVER_DIR=/srv \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --entrypoint python3 homestead:ci -m unittest discover -s /repo/tests -p 'test_self_data*.py' -v
