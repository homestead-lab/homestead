name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; main's runs all finish,
  # so every commit on main has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # What a change touches decides which of the slow checks it needs: the
    # page and dialog audits for the web app, the installer's screens for the
    # installer, the real k3s data moves for the self-data code, and nothing
    # but the docs for a change to the docs alone. A diff that only moves
    # version numbers (a release bump) touches none of them. A push to main
    # is judged the same way, by what it brought since main's last commit:
    # the pull request already ran what it needed, so main does not run every
    # slow check after every merge.
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.paths.outputs.ui }}
      installer: ${{ steps.paths.outputs.installer }}
      self_data: ${{ steps.paths.outputs.self_data }}
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          everything() {
            for job in ui installer self_data code; do echo "$job=true" >> "$GITHUB_OUTPUT"; done
            echo "$1: running every check"; exit 0
          }
          # A pull request's checkout is it merged into main, whose first
          # parent is main. A push compares with main before the push.
          if [ "$EVENT" = "pull_request" ]; then
            BASE=HEAD^1
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
            BASE=$BEFORE
          else
            everything "no earlier commit to compare with"
          fi
          git rev-parse -q --verify "$BASE^{commit}" >/dev/null || everything "cannot read $BASE"
          touches() {
            git diff -U0 "$BASE" HEAD -- "$@" | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---) ' \
              | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?/X/g' > /tmp/lines || true
            [ "$(grep '^+' /tmp/lines | cut -c2- | sort)" != "$(grep '^-' /tmp/lines | cut -c2- | sort)" ] && echo true || echo false
          }
          # A change to this file runs a job only when that job's own steps
          # changed, not for an edit to another job.
          job_changed() {
            block() { git show "$1:.github/workflows/ci.yml" 2>/dev/null | awk -v job="  $2:" '
              $0 == job { on = 1; print; next } on && /^  [a-z][a-z0-9_-]*:$/ { exit } on { print }'; }
            [ "$(block "$BASE" "$1")" != "$(block HEAD "$1")" ] && echo true || echo false
          }
          either() { [ "$1" = true ] || [ "$2" = true ] && echo true || echo false; }
          ui=$(either "$(touches web scripts/audit_dialogs.mjs scripts/audit_pages.mjs)" "$(job_changed dialogs)")
          installer=$(either "$(touches scripts/install.sh scripts/install-console.sh scripts/host-console.py scripts/capture_tui.sh scripts/render_tui.mjs)" "$(job_changed installer-screens)")
          echo "ui=$ui installer=$installer"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"; echo "installer=$installer" >> "$GITHUB_OUTPUT"
          # server.py is in nearly every change: only its lines that wire the
          # data moves count, as do their own modules and tests.
          self_data=$(either "$(touches server/homestead_self_data_*.py server/homestead_storage_journal.py tests/integration/self_data_cluster.py tests/integration/self-data-http.py tests/test_self_data*.py)" "$(job_changed self-data-k3s)")
          if [ "$self_data" = false ] && git diff -U0 "$BASE" HEAD -- server/server.py | grep -E '^[+-][^+-]' | grep -Eqi 'self_data|self-data|storage_journal|SELF_DATA|STORAGE_JOURNAL'; then self_data=true; fi
          echo "self_data=$self_data"; echo "self_data=$self_data" >> "$GITHUB_OUTPUT"
          # Only docs and Markdown: no code to test or image to build.
          if git diff --name-only "$BASE" HEAD | grep -Evq '^docs/|\.md$'; then code=true; else code=false; fi
          echo "code=$code"; echo "code=$code" >> "$GITHUB_OUTPUT"
  self-data-k3s:
    needs: changes
    if: needs.changes.outputs.self_data == 'true'
    runs-on: ubuntu-latest
    # The test stops itself well inside this, with what the cluster looked
    # like; this is only the backstop.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Two real data moves with retained volumes and helper cleanup
        run: python3 -u tests/integration/self_data_cluster.py
  source-copy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rehearse SSH trust and interrupted copies in an isolated fixture
        run: |
          docker build -f tests/integration/source-copy.Dockerfile -t homestead-source-copy-fixture:ci .
          docker run --rm --network none --mount "type=bind,source=$PWD,target=/repo,readonly" homestead-source-copy-fixture:ci
  installer-screens:
    # The installer's and node doctor's menus, driven in tmux as a person
    # would: a menu that stops appearing fails here, before a release.
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Drive the installer's menus
        run: |
          sudo apt-get install -y -qq tmux whiptail >/dev/null
          bash scripts/capture_tui.sh
      - name: Draw them as the wiki shows them
        if: always()
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node scripts/render_tui.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installer-screens
          path: |
            release-assets/*.ans
            release-assets/*.png
  dialogs:
    # Every dialog and every page opened against the demo data at a desktop
    # and a phone width, and checked against docs/design.md: content wider
    # than the screen or dialog, text under 10px, or one that no longer
    # opens fails here. Dialogs and pages run side by side.
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # The dialogs are split across three runners, each with its third of the
    # list; the pages take one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { audit: dialogs, shard: 0, shards: 3 }
          - { audit: dialogs, shard: 1, shards: 3 }
          - { audit: dialogs, shard: 2, shards: 3 }
          - { audit: pages, shard: 0, shards: 1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.55.0-chromium-${{ runner.os }}
      - name: Install the browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Check every ${{ matrix.audit == 'dialogs' && 'dialog' || 'page' }}
        env:
          AUDIT_SHARD: ${{ matrix.shard }}
          AUDIT_SHARDS: ${{ matrix.shards }}
        run: |
          PORT=4173 WEBROOT=web DATA_DIR=/tmp/homestead-demo-data python server/server.py >/tmp/homestead-demo.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/audit_${{ matrix.audit }}.mjs
          if [ "${{ matrix.audit }}" = pages ]; then
            node scripts/check_setup_guide.mjs
            node scripts/check_demo_scenarios.mjs
            node scripts/check_launch_import_logs.mjs
            node scripts/check_mobile_pwa.mjs
            node scripts/check_collection_layouts.mjs
            node scripts/check_dashboard_storage.mjs
            node scripts/check_update_channels.mjs
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ matrix.audit }}-${{ matrix.shard }}
          path: release-assets/${{ matrix.audit }}
  test-and-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install allocation client test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-topology.txt
      - name: Backend tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          for file in web/js/*.js web/sw.js; do node --check "$file"; done
      - name: Frontend unit tests
        run: node --test tests/*.test.js
      - name: Compile Python
        run: python -m compileall -q server
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: homestead:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Verify self-data copies in the built Linux image
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /data \
            --user 0:0 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add FSETID \
            --security-opt no-new-privileges \
            --env HOMESTEAD_TEST_SERVER_DIR=/srv \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --entrypoint python3 homestead:ci -m unittest discover -s /repo/tests -p 'test_self_data*.py' -v
