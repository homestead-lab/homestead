name: Live demo

# The UI on demo.js's made-up data, on GitHub Pages: no server, no cluster.
# Each release brings it up to date; a pull request that touches the UI builds
# and checks it without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "web/**"
      - "scripts/build_demo_site.py"
      - "scripts/check_demo_site.mjs"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the site
        run: python scripts/build_demo_site.py --base "/${{ github.event.repository.name }}/" --out _site
      - name: Install a browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Open every page, as Pages will serve it
        env:
          DEMO_SITE: _site
          DEMO_BASE: /${{ github.event.repository.name }}/
        run: node scripts/check_demo_site.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
