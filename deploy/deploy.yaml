apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harvui
  namespace: lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harvui
rules:
  - apiGroups: [""]
    resources: [namespaces, events, persistentvolumes]
    verbs: [get, list, watch]
  # cordon / uncordon needs patch on the node object
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [nodes/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes/proxy, nodes/stats, nodes/metrics]
    verbs: [get]
  # drain deletes pods; the node-power helper creates a privileged pod
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["apps"]
    resources: [deployments, deployments/scale, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["metrics.k8s.io"]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: ["longhorn.io"]
    resources: [nodes, replicas, engines, settings, backupvolumes]
    verbs: [get, list, watch]
  # data protection: recurring jobs, snapshots, backups, and volume labels
  # (group membership is a label on the volume)
  - apiGroups: ["longhorn.io"]
    resources: [volumes, recurringjobs, snapshots, backups, backuptargets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["kubevirt.io"]
    resources: [virtualmachines, virtualmachineinstances, virtualmachineinstancemigrations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: [virtualmachines/start, virtualmachines/stop, virtualmachines/restart,
                virtualmachineinstances/pause, virtualmachineinstances/unpause]
    verbs: [update]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: [datavolumes]
    verbs: [get, list, watch, create, delete]
  - apiGroups: ["harvesterhci.io"]
    resources: [virtualmachineimages, settings, upgrades]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harvui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harvui
subjects:
  - kind: ServiceAccount
    name: harvui
    namespace: lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harvui-data
  namespace: lab
  labels:
    app: harvui
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn-r2
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvui
  namespace: lab
  labels:
    app: harvui
  annotations:
    harvui.io/update-sources: '{"harvui":"ghcr.io/wjcloudy/harvui:1.9.1"}'
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: harvui
  template:
    metadata:
      labels:
        app: harvui
        lab-workload: "true"
    spec:
      serviceAccountName: harvui
      imagePullSecrets:
        - name: harvui-ghcr
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 10
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 15
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 15
      containers:
        - name: harvui
          image: ghcr.io/wjcloudy/harvui:1.9.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: WEBROOT
              value: "/web"
            - name: DATA_DIR
              value: "/data"
            - name: DEFAULT_NS
              value: "lab"
            - name: SMB_NAMESPACE
              value: "lab"
            - name: STORAGE_CLASS
              value: "longhorn-r2"
            - name: LB_IP
              value: "192.0.2.242"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 3
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: harvui-data
---
apiVersion: v1
kind: Service
metadata:
  name: harvui
  namespace: lab
  labels:
    app: harvui
  annotations:
    kube-vip.io/loadbalancerIPs: 192.0.2.242
spec:
  type: LoadBalancer
  selector:
    app: harvui
  ports:
    - name: http
      port: 8088
      targetPort: 8080
      protocol: TCP
