# Homestead node probe (optional)
#
# Kubernetes reports no physical temperatures, host device inventory, per-disk
# throughput or drive health. This DaemonSet reports them to Homestead, which
# shows them on the node detail page.
#
#   kubectl apply -f deploy/nodeprobe.yaml
#
# Generated by scripts/render_nodeprobe.py from server/homestead_probe.py and
# the scripts in server/probe. Edit those, not this file.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: homestead-nodeprobe
  namespace: lab
data:
  probe.py: |
    #!/usr/bin/env python3
    """Read host sensors, devices and disk counters and serve them as JSON."""
    import json, os, platform, socket, stat, threading, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    SYS = "/host/sys"
    DEV = "/host/dev"
    PROC = "/host/proc"
    _DISK_PREV = {}
    _DISK_LOCK = threading.Lock()

    # USB devices worth naming, so "Coral" shows up as Coral rather than a hex pair
    KNOWN_USB = {
        ("1a6e", "089a"): "Google Coral TPU (unflashed)",
        ("18d1", "9302"): "Google Coral TPU",
        ("0403", "6001"): "FTDI serial",
        ("10c4", "ea60"): "CP210x serial",
        ("1cf1", "0030"): "ConBee/deCONZ Zigbee",
        ("0451", "16a8"): "TI CC2531 Zigbee",
    }

    def _read(p):
        try:
            with open(p) as f:
                return f.read().strip()
        except Exception:
            return None

    def thermal():
        out = []
        base = os.path.join(SYS, "class/thermal")
        if not os.path.isdir(base):
            return out
        for z in sorted(os.listdir(base)):
            if not z.startswith("thermal_zone"):
                continue
            t = _read(os.path.join(base, z, "temp"))
            if t is None:
                continue
            try:
                c = round(int(t) / 1000.0, 1)
            except ValueError:
                continue
            if not (-50 < c < 200):      # ignore obviously bogus zones
                continue
            out.append({"name": _read(os.path.join(base, z, "type")) or z,
                        "zone": z, "celsius": c})
        return out

    def hwmon():
        out = []
        base = os.path.join(SYS, "class/hwmon")
        if not os.path.isdir(base):
            return out
        for h in sorted(os.listdir(base)):
            d = os.path.join(base, h)
            chip = _read(os.path.join(d, "name")) or h
            try:
                files = os.listdir(d)
            except Exception:
                continue
            for f in sorted(files):
                if not (f.startswith("temp") and f.endswith("_input")):
                    continue
                raw = _read(os.path.join(d, f))
                if raw is None:
                    continue
                try:
                    c = round(int(raw) / 1000.0, 1)
                except ValueError:
                    continue
                if not (-50 < c < 200):
                    continue
                label = _read(os.path.join(d, f.replace("_input", "_label"))) or f[:-6]
                out.append({"chip": chip, "name": label, "celsius": c})
        return out

    def devices():
        """What hardware this host actually has. Used to decide whether a
        workload that binds a device can legally run here."""
        out = {"dri": [], "apex": [], "video": [], "tty": [], "usb": [],
               "paths": [], "path_entries": []}
        try:
            entries = os.listdir(DEV)
        except Exception:
            entries = []
        for e in entries:
            if e.startswith("apex"):
                out["apex"].append(e)               # Coral PCIe/M.2
            elif e.startswith("video"):
                out["video"].append(e)
            elif e.startswith(("ttyUSB", "ttyACM")):
                out["tty"].append(e)
        try:
            out["dri"] = sorted(os.listdir(os.path.join(DEV, "dri")))
        except Exception:
            pass

        # Generic device inventory for user-defined hardware features. Keep the
        # walk shallow and bounded: it covers /dev/dri, /dev/bus/usb,
        # /dev/serial/by-id and ordinary accelerator nodes without dumping an
        # unbounded host filesystem tree.
        try:
            for root, dirs, files in os.walk(DEV, followlinks=False):
                depth = os.path.relpath(root, DEV).count(os.sep)
                if depth >= 2:
                    dirs[:] = []
                for entry in sorted(dirs + files):
                    full = os.path.join(root, entry)
                    rel = os.path.relpath(full, DEV).replace(os.sep, "/")
                    path = "/dev/" + rel
                    out["paths"].append(path)
                    try:
                        mode = os.lstat(full).st_mode
                        typ = ("Directory" if stat.S_ISDIR(mode) else
                               "CharDevice" if stat.S_ISCHR(mode) else
                               "BlockDevice" if stat.S_ISBLK(mode) else
                               "Socket" if stat.S_ISSOCK(mode) else "File")
                    except Exception:
                        typ = "File"
                    out["path_entries"].append({"path": path, "type": typ})
                    if len(out["paths"]) >= 800:
                        break
                if len(out["paths"]) >= 800:
                    break
        except Exception:
            pass

        base = os.path.join(SYS, "bus/usb/devices")
        try:
            for d in sorted(os.listdir(base)):
                vid = _read(os.path.join(base, d, "idVendor"))
                pid = _read(os.path.join(base, d, "idProduct"))
                if not vid or not pid:
                    continue
                name = (_read(os.path.join(base, d, "product")) or "").strip()
                bus = _read(os.path.join(base, d, "busnum"))
                dev = _read(os.path.join(base, d, "devnum"))
                out["usb"].append({
                    "vid": vid, "pid": pid,
                    "name": KNOWN_USB.get((vid, pid), name or f"{vid}:{pid}"),
                    "known": (vid, pid) in KNOWN_USB,
                    "path": (f"/dev/bus/usb/{int(bus):03d}/{int(dev):03d}"
                             if bus and dev else ""),
                })
        except Exception:
            pass
        return out

    def disk_activity():
        """Return physical whole-disk throughput calculated between requests.

        Linux diskstats sectors are always 512 bytes, independently of a
        device's logical block size. Partitions and virtual devices are left
        out so the node page shows each physical host disk exactly once.
        """
        raw = _read(os.path.join(PROC, "diskstats")) or ""
        now = time.monotonic()
        current = {}
        disks = []
        for line in raw.splitlines():
            fields = line.split()
            if len(fields) < 14:
                continue
            name = fields[2]
            block = os.path.join(SYS, "class/block", name)
            # A real disk has a sysfs device link. Partitions have a partition
            # marker; loop, device-mapper and RAM devices have no device link.
            if not os.path.isdir(os.path.join(block, "device")):
                continue
            if os.path.exists(os.path.join(block, "partition")):
                continue
            try:
                sectors_read = int(fields[5])
                sectors_written = int(fields[9])
                size_sectors = int(_read(os.path.join(block, "size")) or 0)
            except (TypeError, ValueError):
                continue
            model = (_read(os.path.join(block, "device/model")) or "").strip()
            vendor = (_read(os.path.join(block, "device/vendor")) or "").strip()
            # Harvester/Longhorn iSCSI attachments also have a sysfs device
            # link. They are workload volumes, not node hardware, and can
            # appear/disappear as workloads move.
            if vendor.upper() in ("IET", "LIO-ORG") or "VIRTUAL-DISK" in model.upper():
                continue
            current[name] = (now, sectors_read, sectors_written)
            serial = (_read(os.path.join(block, "device/serial")) or "").strip()
            rotational = _read(os.path.join(block, "queue/rotational")) == "1"
            kind = "NVMe" if name.startswith("nvme") else ("HDD" if rotational else "SSD")
            disks.append({
                "name": name,
                "model": " ".join(x for x in (vendor, model) if x) or name,
                "serial": serial,
                "kind": kind,
                "size_gb": round(size_sectors * 512 / (1024 ** 3), 1),
                "read_sectors": sectors_read,
                "write_sectors": sectors_written,
            })

        with _DISK_LOCK:
            previous = dict(_DISK_PREV)
            _DISK_PREV.clear()
            _DISK_PREV.update(current)

        for disk in disks:
            before = previous.get(disk["name"])
            read_mbps = write_mbps = 0.0
            if before and now > before[0]:
                seconds = now - before[0]
                read_mbps = max(0, disk["read_sectors"] - before[1]) * 512 / seconds / 1_000_000
                write_mbps = max(0, disk["write_sectors"] - before[2]) * 512 / seconds / 1_000_000
            disk["read_mbps"] = round(read_mbps, 3)
            disk["write_mbps"] = round(write_mbps, 3)
            del disk["read_sectors"]
            del disk["write_sectors"]
        return sorted(disks, key=lambda d: d["name"])

    def mounts():
        """Which disk each host filesystem lives on, from PID 1's mount table:
        lets Homestead tell which physical disk a Longhorn disk folder is on,
        and which disk the system runs from."""
        out, seen = [], set()
        raw = _read(os.path.join(PROC, "1/mountinfo")) or ""
        for line in raw.splitlines():
            left, _, right = line.partition(" - ")
            fields, tail = left.split(), right.split()
            if len(fields) < 5 or len(tail) < 2:
                continue
            majmin, mountpoint, fstype, source = fields[2], fields[4], tail[0], tail[1]
            if majmin.startswith("0:"):
                continue                     # tmpfs, overlay, proc: no disk behind them
            try:
                target = os.readlink(os.path.join(SYS, "dev/block", majmin))
            except OSError:
                continue
            # .../block/sda/sda1 for SATA, .../nvme0/nvme0n1/nvme0n1p1 for NVMe:
            # the device is the last part, and a partition's disk the one before.
            parts = [x for x in target.split("/") if x]
            device = parts[-1] if parts else ""
            partition = os.path.exists(os.path.join(SYS, "class/block", device, "partition"))
            disk = parts[-2] if partition and len(parts) > 1 else device
            after = [disk, device]
            key = (disk, mountpoint)
            if not disk or key in seen or mountpoint.startswith(("/var/lib/kubelet/pods", "/run/", "/proc", "/sys")):
                continue
            seen.add(key)
            out.append({"disk": disk, "device": after[-1], "mountpoint": mountpoint.replace("\040", " "),
                        "fstype": fstype, "source": source})
            if len(out) >= 200:
                break
        return out

    def uptime():
        """Seconds since the host booted, from its own /proc."""
        raw = _read(f"{PROC}/uptime")
        try:
            return round(float(raw.split()[0])) if raw else None
        except (ValueError, IndexError):
            return None

    # Interfaces the pod network makes for itself, which no LAN network rides on.
    POD_IFACES = ("lo", "veth", "cni", "flannel", "cali", "vxlan", "kube", "docker", "tunl", "genev",
                  "lxc", "tap", "vnet", "cilium", "weave", "nodelocaldns", "k6t", "virbr")

    def interfaces():
        """The host's own network interfaces a LAN network can sit on: NICs,
        bridges, bonds and VLANs, with the bridge each NIC is in. Read from the
        host's /sys, whose network entries are the host's, not this pod's."""
        base = f"{SYS}/class/net"
        try:
            names = sorted(os.listdir(base))
        except OSError:
            return []
        out = []
        for name in names:
            if name.startswith(POD_IFACES):
                continue
            path = f"{base}/{name}"
            if os.path.isdir(f"{path}/bridge"):
                kind = "bridge"
            elif os.path.isdir(f"{path}/bonding"):
                kind = "bond"
            elif os.path.exists(f"{path}/device"):
                kind = "nic"
            elif "." in name:
                kind = "vlan"
            else:
                continue
            master = os.path.basename(os.path.realpath(f"{path}/master")) if os.path.exists(f"{path}/master") else ""
            out.append({"name": name, "kind": kind, "up": _read(f"{path}/operstate") in ("up", "unknown"),
                        "master": master})
        return out

    # Kernel modules Longhorn's V2 (SPDK) engine needs on a host.
    V2_MODULES = ("vfio_pci", "uio_pci_generic", "nvme_tcp")

    def v2_facts():
        """What Longhorn's V2 engine asks of a host that the host's /proc and
        /sys can say: an x86 CPU with SSE4.2 (arm64 needs none), and its kernel
        modules - loaded, or built in, both show under /sys/module."""
        flags = None
        for line in (_read(f"{PROC}/cpuinfo") or "").splitlines():
            if line.startswith("flags"):
                flags = line.split(":", 1)[-1].split()
                break
        return {"arch": platform.machine(), "sse4_2": ("sse4_2" in flags) if flags is not None else None,
                "modules": {name: os.path.isdir(f"{SYS}/module/{name}") for name in V2_MODULES}}

    def nfs_facts():
        filesystems = _read(f"{PROC}/filesystems")
        if filesystems is None:
            return {"server": None, "client": None}
        names = {line.split()[-1] for line in filesystems.splitlines() if line.split()}
        return {"server": "nfsd" in names, "client": bool(names & {"nfs", "nfs4"})}

    def default_interface():
        """The interface the host's default route leaves by - where it meets the
        LAN - from the route table of the host's first process."""
        raw = _read(f"{PROC}/1/net/route") or ""
        for line in raw.splitlines()[1:]:
            parts = line.split()
            if len(parts) > 7 and parts[1] == "00000000" and parts[7] == "00000000":
                return parts[0]
        return ""

    def payload():
        t, hw = thermal(), hwmon()
        allt = [x["celsius"] for x in t] + [x["celsius"] for x in hw]
        # prefer a package/core sensor for the headline number
        pkg = next((x["celsius"] for x in hw
                    if "package" in (x["name"] or "").lower()
                    or "tctl" in (x["name"] or "").lower()), None)
        if pkg is None:
            pkg = next((x["celsius"] for x in t
                        if "x86_pkg" in (x["name"] or "").lower()), None)
        return {"node": os.environ.get("NODE_NAME", socket.gethostname()),
                "cpu_c": pkg if pkg is not None else (max(allt) if allt else None),
                "max_c": max(allt) if allt else None,
                "thermal": t, "hwmon": hw,
                "sensors": len(t) + len(hw),
                "devices": devices(),
                "disks": disk_activity(),
                "mounts": mounts(),
                "uptime_s": uptime(),
                # Hardware virtualisation, which KubeVirt runs VMs with; without
                # it KubeVirt can only emulate, many times slower.
                "kvm": os.path.exists(f"{DEV}/kvm"),
                "interfaces": interfaces(),
                "default_interface": default_interface(),
                "v2": v2_facts(), "nfs": nfs_facts()}

    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        def log_message(self, *a): pass
        def do_GET(self):
            b = json.dumps(payload()).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 9099), H).serve_forever()
  smart.py: |
    #!/usr/bin/env python3
    """Narrow HTTP wrapper around smartctl for Homestead's optional helper."""
    import hashlib, hmac, json, os, re, subprocess, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, urlparse

    SYS = "/host/sys"
    DEV = "/host/dev"
    AUTH_STORE = "/auth/store.json"
    NODE = os.environ.get("NODE_NAME", "")

    def read(path):
        try:
            with open(path) as handle:
                return handle.read().strip()
        except Exception:
            return ""

    def disks():
        rows = []
        base = os.path.join(SYS, "class/block")
        try:
            names = sorted(os.listdir(base))
        except Exception:
            return rows
        for name in names:
            block = os.path.join(base, name)
            if not os.path.isdir(os.path.join(block, "device")):
                continue
            if os.path.exists(os.path.join(block, "partition")):
                continue
            model = read(os.path.join(block, "device/model"))
            vendor = read(os.path.join(block, "device/vendor"))
            if vendor.upper() in ("IET", "LIO-ORG") or "VIRTUAL-DISK" in model.upper():
                continue
            path = os.path.join(DEV, name)
            if os.path.exists(path):
                rows.append((name, path))
        return rows

    def device_type(name):
        # smartctl normally infers this from a /dev path. The host device tree
        # is deliberately mounted at /host/dev, so make the transport explicit.
        if name.startswith("nvme"):
            return "nvme"
        block = os.path.join(SYS, "class/block", name, "device")
        vendor = read(os.path.join(block, "vendor")).upper()
        model = read(os.path.join(block, "model")).upper()
        if vendor == "ATA" or model.startswith("ATA "):
            return "sat"
        return "scsi"

    def run(args, timeout=15):
        done = subprocess.run(["smartctl", *args], capture_output=True, text=True,
                              timeout=timeout, check=False)
        try:
            value = json.loads(done.stdout or "{}")
        except Exception:
            value = {}
        messages = [str(row.get("string") or "") for row in value.get("messages", [])]
        if done.stderr.strip():
            messages.append(done.stderr.strip())
        return done.returncode, value, "; ".join(x for x in messages if x)[:500]

    def raw_attr(data, attr_id):
        table = ((data.get("ata_smart_attributes") or {}).get("table") or [])
        item = next((row for row in table if int(row.get("id", -1)) == attr_id), None)
        raw = (item or {}).get("raw") or {}
        value = raw.get("value")
        if value is None:
            match = re.search(r"-?\d+", str(raw.get("string") or ""))
            value = int(match.group()) if match else None
        return value

    def norm_attr(data, attr_id):
        """An attribute's normalised value and how far it is above failing.

        SMART attributes are reported both raw and normalised. The normalised
        value counts down from 100 towards a manufacturer threshold, so it is
        the closest thing a drive gives to a percentage of life left.
        """
        table = ((data.get("ata_smart_attributes") or {}).get("table") or [])
        item = next((row for row in table if int(row.get("id", -1)) == attr_id), None)
        if not item:
            return None, None
        value, thresh = item.get("value"), (item.get("thresh") or 0)
        if value is None:
            return None, None
        span = max(1, 100 - int(thresh))
        margin = max(0, min(100, round((int(value) - int(thresh)) / span * 100)))
        return int(value), margin

    def wear(data, nvme):
        """How much life the drive says it has left, and what said so.

        NVMe counts endurance used; SATA SSDs carry a life-left attribute;
        spinning disks have no such figure, so the closest honest answer is
        how near the worst attribute is to its failure threshold.
        """
        used = nvme.get("percentage_used")
        if used is not None:
            return {"life_pct": max(0, 100 - int(used)), "basis": "NVMe endurance used",
                    "spare_pct": nvme.get("available_spare"),
                    "spare_floor_pct": nvme.get("available_spare_threshold")}
        # 231 SSD_Life_Left, 177 Wear_Leveling_Count, 233 Media_Wearout_Indicator
        for attr_id, label in ((231, "SSD life left"), (233, "media wearout indicator"),
                               (177, "wear levelling count")):
            value, _ = norm_attr(data, attr_id)
            if value is not None:
                return {"life_pct": max(0, min(100, value)), "basis": label,
                        "spare_pct": None, "spare_floor_pct": None}
        table = ((data.get("ata_smart_attributes") or {}).get("table") or [])
        margins = []
        for row in table:
            # Only attributes the drive itself says predict failure.
            if not ((row.get("flags") or {}).get("prefailure")):
                continue
            _, margin = norm_attr(data, int(row.get("id", -1)))
            if margin is not None:
                margins.append(margin)
        if margins:
            return {"life_pct": min(margins), "basis": "worst pre-failure attribute",
                    "spare_pct": None, "spare_floor_pct": None}
        return {"life_pct": None, "basis": "", "spare_pct": None, "spare_floor_pct": None}

    def test_rows(data):
        table = ((data.get("ata_smart_self_test_log") or {}).get("standard") or {}).get("table") or []
        if not table:
            table = (data.get("nvme_self_test_log") or {}).get("table") or []
        if not table:
            table = [value for key, value in sorted(data.items())
                     if key.startswith("scsi_self_test_") and isinstance(value, dict)]
        out = []
        for row in table[:20]:
            status = row.get("status") or row.get("result") or {}
            text = status.get("string") if isinstance(status, dict) else str(status)
            test = row.get("type") or row.get("self_test_code") or {}
            test = test.get("string") if isinstance(test, dict) else str(test)
            hours = row.get("lifetime_hours") or (row.get("power_on_time") or {}).get("hours")
            signature = f"{test}|{text}|{hours}|{row.get('lba_of_first_error', '')}"
            out.append({"type": test or "Self-test", "status": text or "Unknown",
                        "lifetime_hours": hours, "signature": signature})
        return out

    def report(name, path):
        code, data, message = run(["-d", device_type(name), "-a", "-j", path])
        device = data.get("device") or {}
        protocol = str(device.get("protocol") or "")
        nvme = data.get("nvme_smart_health_information_log") or {}
        scsi_errors = data.get("scsi_error_counter_log") or {}
        scsi = protocol.lower() in ("scsi", "sas") or bool(scsi_errors)
        support = data.get("smart_support") or {}
        available = bool(support.get("available") or nvme or data.get("smart_status"))
        temperature = (data.get("temperature") or {}).get("current")
        if temperature is None:
            temperature = nvme.get("temperature")
        if temperature is None:
            temperature = (data.get("scsi_temperature") or {}).get("current")
        power_hours = (data.get("power_on_time") or {}).get("hours")
        if power_hours is None:
            power_hours = nvme.get("power_on_hours")
        if power_hours is None:
            power_hours = raw_attr(data, 9)
        if temperature is None:
            temperature = raw_attr(data, 194)
        if temperature is None:
            temperature = raw_attr(data, 190)
        health = "unknown"
        if isinstance(data.get("smart_status"), dict):
            health = "passed" if data["smart_status"].get("passed") else "failed"
        elif nvme:
            health = "passed" if int(nvme.get("critical_warning", 0) or 0) == 0 else "failed"
        polling = ((data.get("ata_smart_data") or {}).get("self_test") or {}).get("polling_minutes") or {}
        nvme_log = data.get("nvme_self_test_log") or {}
        supported = []
        if polling.get("short") or nvme_log or (scsi and available):
            supported.append("short")
        if polling.get("extended") or nvme_log or (scsi and available):
            supported.append("long")
        current = ((data.get("ata_smart_data") or {}).get("self_test") or {}).get("status") or {}
        current_text = str(current.get("string") or "")
        remaining = current.get("remaining_percent")
        if not current_text and nvme_log:
            operation = nvme_log.get("current_self_test_operation") or {}
            completion = nvme_log.get("current_self_test_completion_percent")
            current_text = str(operation.get("string") or "")
            inactive = "no self-test" in current_text.lower() or "not running" in current_text.lower()
            remaining = (100 - int(completion)
                         if completion is not None and not inactive else None)
        inactive = "no self-test" in current_text.lower() or "not running" in current_text.lower()
        active = not inactive and ("in progress" in current_text.lower()
                                   or (remaining is not None and int(remaining) > 0))
        rows = test_rows(data)
        size = (data.get("user_capacity") or {}).get("bytes")
        unavailable = ""
        if not available:
            unavailable = message or "This drive or bridge does not expose SMART data"
        if code & 3 and not data:
            unavailable = message or "smartctl could not open this device"
        scsi_uncorrected = sum(int((scsi_errors.get(kind) or {}).get("total_uncorrected_errors", 0) or 0)
                               for kind in ("read", "write", "verify"))
        return {
            "name": name, "path": "/dev/" + name, "available": available,
            "unavailable_reason": unavailable, "protocol": protocol,
            "model": data.get("model_name") or data.get("product") or "",
            "serial": data.get("serial_number") or "",
            "firmware": data.get("firmware_version") or data.get("revision") or "",
            "capacity_gb": round(int(size or 0) / (1024 ** 3), 1),
            "smart_enabled": support.get("enabled"), "health": health,
            "temperature_c": temperature, "power_on_hours": power_hours,
            "reallocated": raw_attr(data, 5), "pending": raw_attr(data, 197),
            "uncorrectable": raw_attr(data, 198),
            "error_count": ((data.get("ata_smart_error_log") or {}).get("summary") or {}).get("count",
                             nvme.get("num_err_log_entries", scsi_uncorrected if scsi else None)),
            "media_errors": nvme.get("media_errors"),
            "wear": wear(data, nvme),
            # An NVMe drive keeps a different set of books from an ATA one. Showing
            # its own counters beats four rows of "unsupported" ATA attributes.
            "nvme": {
                "available_spare": nvme.get("available_spare"),
                "available_spare_threshold": nvme.get("available_spare_threshold"),
                "percentage_used": nvme.get("percentage_used"),
                "unsafe_shutdowns": nvme.get("unsafe_shutdowns"),
                "data_units_written": nvme.get("data_units_written"),
                "critical_warning": nvme.get("critical_warning"),
            } if nvme else None,
            "supported_tests": supported,
            "test": {"active": active, "status": current_text or "No self-test running",
                     "remaining_percent": remaining},
            "self_tests": rows,
            "expected_seconds": {"short": int(polling.get("short", 2) or 2) * 60,
                                 "long": int(polling.get("extended", 10) or 10) * 60},
            "smartctl_messages": message,
        }

    def one(name):
        match = next((row for row in disks() if row[0] == name), None)
        if not match:
            raise ValueError("disk was not found on this host")
        return report(*match)

    def signature_ok(raw, stamp, supplied):
        try:
            if abs(time.time() - int(stamp)) > 30:
                return False
            with open(AUTH_STORE) as handle:
                key = json.load(handle).get("signing_key", "").encode()
            expected = hmac.new(key, stamp.encode() + b"." + raw, hashlib.sha256).hexdigest()
            return bool(key and hmac.compare_digest(expected, supplied or ""))
        except Exception:
            return False

    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        def log_message(self, *args): pass
        def send_json(self, code, value):
            raw = json.dumps(value, separators=(",", ":")).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)
        def do_GET(self):
            try:
                if urlparse(self.path).path == "/healthz":
                    return self.send_json(200, {"ok": True, "node": NODE})
                name = (parse_qs(urlparse(self.path).query).get("disk") or [""])[0]
                if name:
                    return self.send_json(200, {"node": NODE, "disk": one(name)})
                return self.send_json(200, {"node": NODE,
                    "disks": [report(name, path) for name, path in disks()]})
            except Exception as error:
                return self.send_json(400, {"error": str(error)[:500]})
        def do_POST(self):
            length = min(4096, int(self.headers.get("Content-Length") or 0))
            raw = self.rfile.read(length)
            if not signature_ok(raw, self.headers.get("X-Homestead-Time", ""),
                                self.headers.get("X-Homestead-Signature", "")):
                return self.send_json(403, {"error": "request signature is invalid"})
            try:
                body = json.loads(raw.decode())
                if body.get("node") != NODE:
                    raise ValueError("node does not match this helper")
                name = str(body.get("disk") or "")
                test = str(body.get("test") or "").lower()
                if test == "abort":
                    path = next((path for disk, path in disks() if disk == name), None)
                    if not path:
                        raise ValueError("disk was not found on this host")
                    code, _, message = run(["-d", device_type(name), "-X", "-j", path], timeout=20)
                    if code & 3:
                        raise ValueError(message or "smartctl could not abort the test")
                    return self.send_json(200, {"ok": True, "node": NODE, "disk": name,
                        "message": message or "Self-test aborted"})
                if test not in ("short", "long"):
                    raise ValueError("test must be short, long or abort")
                before = one(name)
                if test not in before.get("supported_tests", []):
                    raise ValueError(f"this disk does not advertise a {test} self-test")
                if (before.get("test") or {}).get("active"):
                    raise ValueError("a self-test is already running")
                path = next(path for disk, path in disks() if disk == name)
                code, data, message = run(
                    ["-d", device_type(name), "-t", test, "-j", path], timeout=20)
                if code & 3:
                    raise ValueError(message or "smartctl could not start the test")
                expected = int((before.get("expected_seconds") or {}).get(test, 0) or 0)
                return self.send_json(200, {"ok": True, "node": NODE,
                    "disk": name, "test": test, "expected_seconds": expected,
                    "baseline": ((before.get("self_tests") or [{}])[0].get("signature") or ""),
                    "started_epoch": int(time.time()),
                    "message": message or f"{test.title()} SMART test started"})
            except Exception as error:
                return self.send_json(400, {"error": str(error)[:500]})

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 9100), H).serve_forever()
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: homestead-nodeprobe
  namespace: lab
  labels:
    app: homestead-nodeprobe
spec:
  selector:
    matchLabels:
      app: homestead-nodeprobe
  template:
    metadata:
      labels:
        app: homestead-nodeprobe
    spec:
      terminationGracePeriodSeconds: 2
      tolerations:
        - operator: Exists
      containers:
        - name: probe
          image: python:3.12-alpine
          command:
            - python3
            - "/srv/probe.py"
          ports:
            - containerPort: 9099
              name: http
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: code
              mountPath: "/srv"
              readOnly: true
            - name: sys
              mountPath: "/host/sys"
              readOnly: true
            - name: dev
              mountPath: "/host/dev"
              readOnly: true
            - name: proc
              mountPath: "/host/proc"
              readOnly: true
        - name: smart
          image: ghcr.io/wjcloudy/homestead:2.8.158
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - "/srv/smart.py"
          ports:
            - containerPort: 9100
              name: smart
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: "/healthz"
              port: smart
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: code
              mountPath: "/srv"
              readOnly: true
            - name: sys
              mountPath: "/host/sys"
              readOnly: true
            - name: dev
              mountPath: "/host/dev"
            - name: auth
              mountPath: "/auth"
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: homestead-nodeprobe
        - name: sys
          hostPath:
            path: "/sys"
            type: Directory
        - name: dev
          hostPath:
            path: "/dev"
            type: Directory
        - name: proc
          hostPath:
            path: "/proc"
            type: Directory
        - name: auth
          secret:
            secretName: homestead-auth
            optional: true
