{{- $image := include "homestead.image" . }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homestead-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homestead.labels" . | nindent 4 }}
  annotations:
    # Settings, users and history outlive an uninstall.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homestead
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homestead.labels" . | nindent 4 }}
  annotations:
    homestead.io/update-sources: {{ printf "{\"homestead\":\"%s\"}" $image | squote }}
spec:
  replicas: 1
  strategy:
    # One pod mounts the data volume at a time; see deploy/deploy.yaml.
    type: Recreate
  selector:
    matchLabels:
      app: homestead
  template:
    metadata:
      labels:
        app: homestead
        lab-workload: "true"
    spec:
      serviceAccountName: homestead
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 10
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 15
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 15
      initContainers:
        - name: data-permissions
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "chown 10001:10001 /data && chmod 0770 /data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: homestead
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "8080"
            - name: WEBROOT
              value: "/web"
            - name: DATA_DIR
              value: "/data"
            - name: DEFAULT_NS
              value: {{ .Values.workloadNamespace.name | quote }}
            - name: SMB_NAMESPACE
              value: {{ .Values.workloadNamespace.name | quote }}
            - name: STORAGE_CLASS
              value: {{ .Values.storageClass | quote }}
            - name: LB_IP
              value: {{ .Values.service.loadBalancerIP | quote }}
            - name: CF_ACCESS_TEAM_DOMAIN
              value: {{ .Values.cloudflareAccess.teamDomain | quote }}
            - name: CF_ACCESS_AUD
              value: {{ .Values.cloudflareAccess.aud | quote }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 3
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if not .Values.persistence.enabled }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default "homestead-data" }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: homestead
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homestead.labels" . | nindent 4 }}
    homestead.io/managed: "true"
  {{- $annotations := deepCopy .Values.service.annotations }}
  {{- if and .Values.service.loadBalancerIP .Values.service.kubeVip }}
  {{- $_ := set $annotations "kube-vip.io/loadbalancerIPs" .Values.service.loadBalancerIP }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.loadBalancerIP (not .Values.service.kubeVip) }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  selector:
    app: homestead
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
