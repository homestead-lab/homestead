{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homestead
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homestead
rules:
  - apiGroups: [""]
    resources: [namespaces, events]
    verbs: [get, list, watch]
  # Settings > Namespaces creates namespaces for apps, and removes one only
  # when it is empty and not a platform namespace.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, delete]
  # Volume deletion explicitly flips the bound PV between Retain and Delete
  # after an impact preview; no broader PV mutation is used.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, patch]
  # cordon / uncordon needs patch on the node object; removing a dead host
  # deletes it, after a quorum and data-loss preflight refuses a live one
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, update, delete]
  - apiGroups: [""]
    resources: [nodes/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes/proxy, nodes/stats, nodes/metrics]
    verbs: [get]
  # drain deletes pods; the node-power helper creates a privileged pod
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims, configmaps, endpoints]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["apps"]
    resources: [deployments, deployments/scale, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Workload rename keeps any autoscaler attached to the replacement Deployment.
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, update]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: ["loadbalancer.harvesterhci.io"]
    resources: [ippools]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    # Backup restore uses a deterministic, reusable CSI StorageClass whose
    # fromBackup parameter points at the selected Longhorn backup.
    verbs: [get, list, create]
  - apiGroups: ["longhorn.io"]
    resources: [engines, settings, backupvolumes]
    verbs: [get, list, watch]
  # Replica records on a host that is gone for good are deleted so Longhorn
  # rebuilds them elsewhere; only on a node that no longer exists.
  - apiGroups: ["longhorn.io"]
    resources: [replicas]
    verbs: [get, list, watch, delete]
  # A removed host's Longhorn record is deleted once it holds no replicas;
  # Longhorn only allows that after scheduling to it has been turned off.
  - apiGroups: ["longhorn.io"]
    resources: [nodes]
    verbs: [get, list, watch, patch, delete]
  # ...and the Cluster API machine Rancher kept for it.
  - apiGroups: ["cluster.x-k8s.io"]
    resources: [machines]
    verbs: [get, list, patch, delete]
  # A dead host's volume attachments hold its volumes there; letting go of them
  # is what lets the volumes attach on another node.
  - apiGroups: ["storage.k8s.io"]
    resources: [volumeattachments]
    verbs: [get, list, delete]
  # data protection: recurring jobs, snapshots, backups, and volume labels
  # (group membership is a label on the volume)
  - apiGroups: ["longhorn.io"]
    resources: [volumes, recurringjobs, snapshots, backups, backuptargets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["kubevirt.io"]
    resources: [virtualmachines, virtualmachineinstances, virtualmachineinstancemigrations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - virtualmachines/start
      - virtualmachines/stop
      - virtualmachines/restart
      - virtualmachineinstances/pause
      - virtualmachineinstances/unpause
    verbs: [update]
  # The VM console: the screen (VNC) and the serial port, streamed through
  # Homestead so the browser never holds the service-account token.
  - apiGroups: ["subresources.kubevirt.io"]
    resources: [virtualmachineinstances/vnc, virtualmachineinstances/console]
    verbs: [get]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: [datavolumes]
    verbs: [get, list, watch, create, delete]
  # upgrades and versions: the Cluster page shows what Harvester offers and
  # follows an upgrade started in Harvester's dashboard; it never starts one.
  - apiGroups: ["harvesterhci.io"]
    resources: [virtualmachineimages, settings, upgrades, versions]
    verbs: [get, list]
  # Cluster health reads certificate request state only; certificate/key bodies
  # are never returned to the UI and Homestead cannot approve CSRs.
  # Helm: releases are read from Helm's own Secrets (secrets are listed
  # above); charts are installed as HelmChart objects for RKE2's Helm controller.
  - apiGroups: ["helm.cattle.io"]
    resources: [helmcharts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Resources: every kind the cluster serves, as a general Kubernetes UI shows
  # it - read by anyone signed in, and edited, created or deleted there by an
  # admin. This is what a Headlamp user expects, and it makes plain what the
  # escalate rule below already allows: Homestead can change the cluster.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  # Replicas elect the one that raises alerts and advances moves.
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: ["certificates.k8s.io"]
    resources: [certificatesigningrequests]
    verbs: [get, list, watch]
  # Homestead keeps these permissions in step with its release, the way it
  # keeps the node probe's scripts: an in-app upgrade brings what its new
  # features need, and nobody re-applies this file for them. escalate is what
  # lets a role be given rules its holder lacks, so this is in effect
  # cluster-admin - as starting privileged pods (the node probe, image
  # cleanup, node power) already is. It reaches Homestead's own role only.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [clusterroles]
    resourceNames: [homestead]
    verbs: [get, update, escalate]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [clusterrolebindings]
    resourceNames: [homestead]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homestead
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homestead
subjects:
  - kind: ServiceAccount
    name: homestead
    namespace: {{ .Release.Namespace }}
---
# Interactive exec is deliberately namespace-scoped. The ClusterRole above does
# not grant pods/exec anywhere else, and the backend also enforces this boundary.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homestead-console
  namespace: {{ .Values.workloadNamespace.name }}
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    # create covers the traditional POST upgrade; get covers modern WebSocket GET.
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homestead-console
  namespace: {{ .Values.workloadNamespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homestead-console
subjects:
  - kind: ServiceAccount
    name: homestead
    namespace: {{ .Release.Namespace }}
{{- end }}
